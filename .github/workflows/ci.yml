name: Native Go foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified upstream tag
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6; verified upstream tag
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and integration fixtures
        run: |
          if go test -json ./... -count=1 > "$RUNNER_TEMP/miskoai-tests.jsonl"; then
            echo "Synthetic unit/integration tests passed"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/miskoai-tests.jsonl" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1])]
          failed = {e['Package'] for e in events if e.get('Action') == 'fail'}
          for package in sorted(failed):
              names = {e.get('Test') for e in events if e.get('Package') == package and e.get('Action') == 'fail' and e.get('Test')}
              output = ''.join(e.get('Output', '') for e in events if e.get('Package') == package and (not e.get('Test') or e.get('Test') in names))
              # Only synthetic CI fixtures run here; no live keys/QR are supplied.
              message = (package + ': ' + output[-6000:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + message)
          PY
          exit 1
      - name: Vet
        run: go vet ./...
      - name: Race detector on native Linux runner
        run: go test -race ./... -count=1
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Secret policy including history
        run: python3 scripts/secret_scan.py --history
      - name: Cross-build native Linux binaries without cgo
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/miskoai-linux-amd64 ./cmd/miskoai
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/miskoai-linux-arm64 ./cmd/miskoai
